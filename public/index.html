<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AK Logistic & Transport</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}header{background:#075ee6;color:#fff;padding:22px;text-align:center}main{max-width:1050px;margin:auto;padding:15px}.panel,.card{background:#fff;padding:16px;border-radius:15px;margin:12px 0;box-shadow:0 4px 16px #0001}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.stats div{background:white;padding:14px;text-align:center;border-radius:13px}input,select,button{width:100%;padding:12px;margin:5px 0;border:1px solid #ccd4df;border-radius:9px;font-size:16px}button{background:#075ee6;color:white;border:0;font-weight:700}.green{background:#18864b}.red{background:#bd2c2c}.gray{background:#667085}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hide{display:none}@media(max-width:720px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}</style></head>
<body><header><h1>🚚 AK Logistic & Transport</h1><p>Parcel Pickup Management</p></header><main>
<section id="public" class="panel"><h2>📦 Customer Tracking / 客户查询</h2><input id="pubTrack" placeholder="Tracking Number"><button onclick="track()">TRACK / 查询</button><div id="trackResult"></div></section>
<section id="login" class="panel"><h2>🔐 Admin Login</h2><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="login()">LOGIN</button></section>
<section id="app" class="hide"><div class="stats"><div>📦 Total<br><b id="total">0</b></div><div>🟡 Waiting<br><b id="waiting">0</b></div><div>🟢 Picked<br><b id="picked">0</b></div><div>🔴 Unclaimed<br><b id="unclaimed">0</b></div><div>💰 Fees<br><b id="fees">฿0</b></div></div>
<div class="grid">
<input id="tracking" placeholder="Tracking / Barcode">
<input id="customer" placeholder="Customer Name">
<input id="recipient" placeholder="Recipient">
<input id="weight_kg" type="number" placeholder="Weight KG">
<input id="phone" placeholder="Phone">
<input id="fee" type="number" placeholder="Fee THB" readonly>
<button type="button" onclick="add()">💾 SAVE PARCEL</button>
</div>

<div class="panel"><h2>Search</h2><div class="grid"><input id="q" placeholder="Tracking / Customer"><select id="status"><option value="">All Status</option><option>Waiting Pickup</option><option>Picked Up</option><option>Unclaimed</option></select></div><button onclick="load()">SEARCH</button><button class="gray" onclick="exportCSV()">EXPORT CSV</button><button class="gray" onclick="window.print()">PRINT</button></div><div id="list"></div>
<button class="red" onclick="logout()">LOGOUT</button></section></main>
<script>
document.getElementById("weight_kg").oninput = function(){
    document.getElementById("fee").value = Number(this.value || 0) * 150;
}
let current=[],$=x=>document.getElementById(x);async function req(url,opt={}){let r=await fetch(url,{headers:{"Content-Type":"application/json"},...opt});let d=await r.json();if(!r.ok)throw Error(d.error||"Error");return d}
async function track(){try{let d=await req("/api/public/track/"+encodeURIComponent($("pubTrack").value.trim()));$("trackResult").innerHTML=`<div class="card"><b>${d.tracking}</b><br>Customer: ${d.customer}<br>Fee: ฿${d.fee}<br>Arrival: ${d.arrival}<br>Pickup: ${d.pickup||"-"}<br>Status: <b>${d.status}</b></div>`}catch(e){$("trackResult").textContent=e.message}}
async function login(){
    try{
        let r = await fetch("/api/login",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                username:document.getElementById("u").value.trim(),
password:document.getElementById("p").value.trim()
            })
        });

        let d = await r.json();

        if(d.ok){
            document.getElementById("login").style.display="none";
            document.getElementById("app").classList.remove("hide");
            load();
        }else{
            alert(d.error || "Login failed");
        }

    }catch(e){
        alert("Connection error: "+e.message);
    }
}
async function logout(){await req("/api/logout",{method:"POST"});location.reload()}
async function add(){
    try{
        await req("/api/parcels",{
            method:"POST",
            body:JSON.stringify({
                tracking:$("tracking").value.trim(),
customer:$("customer").value.trim(),
recipient:$("recipient").value.trim(),
weight_kg:$("weight_kg").value.trim(),
phone:$("phone").value.trim(),
fee:$("fee").value.trim()
            })
        });
        load();
    }catch(e){
        alert(e.message);
    }
}
async function pickup(t){await req("/api/parcels/"+encodeURIComponent(t)+"/pickup",{method:"POST"});load()}
async function delp(t){if(confirm("Delete this parcel?")){await req("/api/parcels/"+encodeURIComponent(t),{method:"DELETE"});load()}}
async function load(){try{let s=await req("/api/stats");["total","waiting","picked","unclaimed"].forEach(x=>$(x).textContent=s[x]);$("fees").textContent="฿"+Number(s.fees).toLocaleString();current=await req("/api/parcels?q="+encodeURIComponent($("q").value)+"&status="+encodeURIComponent($("status").value));$("list").innerHTML=current.map(p=>`<div class="card"><b>${p.tracking}</b><br>Customer: ${p.customer}<br>Phone: ${p.phone||"-"}<br>Fee:Weight: ${p.weight_kg} KG<br> ฿${p.fee}<br>Arrival: ${p.arrival}<br>Pickup: ${p.pickup||"-"}<br>Status: <b>${p.status}</b>${p.status!=="Picked Up"?`<button class="green" onclick="pickup('${p.tracking}')">CONFIRM PICKUP</button>`:""}<button class="red" onclick="delp('${p.tracking}')">DELETE</button></div>`).join("")||"<div class=panel>No parcel found.</div>"}catch(e){if(e.message==="Unauthorized"){}else alert(e.message)}}
function exportCSV(){let rows=[["Tracking","Customer","Phone","Fee","Arrival","Pickup","Status"],...current.map(p=>[p.tracking,p.customer,p.phone,p.fee,p.arrival,p.pickup,p.status])];let csv=rows.map(r=>r.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(",")).join("\\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv]));a.download="AK_Logistic_Report.csv";a.click()}
</script></body></html>
